name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Siapkan proyek
        id: p
        run: |
          F=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          if [ -z "$F" ]; then
            Z=$(find . -name '*.zip' -not -path './.git/*' | head -1)
            if [ -z "$Z" ]; then echo "Tidak ada proyek maupun file zip di repository"; exit 1; fi
            mkdir -p /tmp/proj && unzip -q "$Z" -d /tmp/proj
            F=$(find /tmp/proj -name settings.gradle.kts | head -1)
          fi
          if [ -z "$F" ]; then echo "settings.gradle.kts tidak ditemukan"; exit 1; fi
          echo "dir=$(dirname "$F")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Terima lisensi Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
